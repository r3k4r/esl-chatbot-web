    (function () {
      const D = 4.859;
      const tl = gsap.timeline({ paused: true });
      const q = (id) => document.getElementById(id);

      // background: one slow light sweep + grid parallax + keyword drift, full frame
      tl.fromTo(q("f06-light"), { x: 300, y: 720 }, { x: 1500, y: 260, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo(q("f06-grid"), { x: 0, y: 0 }, { x: -48, y: -24, duration: D, ease: "none" }, 0);
      tl.fromTo(q("f06-kw"), { x: 0 }, { x: -50, duration: D, ease: "none" }, 0);

      // camera: 3D dolly that turns on each cue
      tl.fromTo(q("f06-cam"), { rotationY: 8, rotationX: -5, scale: 1 },
        { rotationY: 4, rotationX: -3, scale: 1.02, duration: 1.79, ease: "sine.out" }, 0);
      tl.fromTo(q("f06-cam"), { rotationY: 4, rotationX: -3, scale: 1.02 },
        { rotationY: 0, rotationX: -2, scale: 1.035, duration: 1.15, ease: "power2.inOut", immediateRender: false }, 1.79);
      tl.fromTo(q("f06-cam"), { rotationY: 0, rotationX: -2, scale: 1.035 },
        { rotationY: -4, rotationX: -1, scale: 1.06, duration: D - 2.94, ease: "power3.out", immediateRender: false }, 2.94);
      // foreground parallax against the window
      tl.fromTo(q("f06-fg"), { x: 0 }, { x: -24, duration: D, ease: "sine.inOut" }, 0);

      // window: ghosted from t=0, swings in from a 3D tilt on "become", then drifts
      tl.fromTo(q("f06-window"),
        { opacity: 0.3, x: 90, rotationY: -20, scale: 0.93, filter: "blur(10px)", transformPerspective: 1600 },
        { opacity: 1, x: 0, rotationY: -6, scale: 1, filter: "blur(0px)", transformPerspective: 1600, duration: 0.8, ease: "expo.out" }, 1.79);
      tl.fromTo(q("f06-window"), { x: 0, rotationY: -6 },
        { x: -14, rotationY: -3, duration: D - 2.6, ease: "sine.inOut", immediateRender: false }, 2.6);

      // Scene 1: chips arc in spinning with motion blur, drop into the stack, deck fans then restacks
      const cards = [
        { chip: "f06-chip1", card: "f06-card1", start: 0.05, rot: -7, x: -22, y: 16, spin: -40, fan: { x: -120, y: 26, rotation: -17 } },
        { chip: "f06-chip2", card: "f06-card2", start: 0.47, rot: -3.5, x: -10, y: 8, spin: -28, fan: { x: 96, y: 18, rotation: 12 } },
        { chip: "f06-chip3", card: "f06-card3", start: 0.88, rot: 0, x: 0, y: 0, spin: -34 },
      ];
      cards.forEach((c) => {
        const chip = q(c.chip);
        const card = q(c.card);
        const land = c.start + 0.6;
        tl.fromTo(chip, { xPercent: -50, yPercent: -50, x: -900, rotation: c.spin, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, c.start);

        tl.fromTo(chip, { y: 260 }, { y: -110, duration: 0.34, ease: "power2.out" }, c.start);
        tl.fromTo(chip, { y: -110 }, { y: 0, duration: 0.26, ease: "power2.in", immediateRender: false }, c.start + 0.34);
        // handoff: chip melts into its card as the card slams onto the stack
        tl.fromTo(chip, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.8, duration: 0.14, ease: "power1.in", immediateRender: false }, land);
        tl.fromTo(card,
          { opacity: 0, x: c.x, y: c.y - 60, rotation: c.rot * 2.5 - 6, scale: 1.15 },
          { opacity: 1, x: c.x, y: c.y, rotation: c.rot, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, land - 0.02);
        if (c.fan) {
          tl.fromTo(card, { x: c.x, y: c.y, rotation: c.rot },
            { x: c.fan.x, y: c.fan.y, rotation: c.fan.rotation, duration: 0.24, ease: "expo.out", immediateRender: false }, 1.56);
          tl.fromTo(card, { x: c.fan.x, y: c.fan.y, rotation: c.fan.rotation },
            { x: c.x, y: c.y, rotation: c.rot, duration: 0.36, ease: "back.out(1.6)", immediateRender: false }, 1.84);
        }
      });

      // Scene 2: top card lifts and does a big 3D flip to the real flashcard on "flashcards", then a glint
      tl.fromTo(q("f06-card3"), { scale: 1 }, { scale: 1.1, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.05);
      tl.fromTo(q("f06-card3"), { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 2.4);
      tl.fromTo(q("f06-flipper"), { rotationY: 0 }, { rotationY: 180, duration: 0.75, ease: "back.out(1.3)" }, 2.05);
      tl.fromTo(q("f06-glint"), { x: -520 }, { x: 520, duration: 0.55, ease: "power2.inOut" }, 2.72);

      tl.fromTo(q("f06-kw"), { opacity: 1 }, { opacity: 0.22, duration: 0.7, ease: "power2.inOut" }, 3.75);
