  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const ID = "05-say-it-out-loud";
      const D = 7.236;
      const $ = (s) => document.getElementById(ID + "-" + s);

      // build wave bars + per-char caption spans (deterministic DOM)
      const N = 11;
      ["wl", "wt"].forEach((w) => { for (let i = 0; i < N; i++) $(w).appendChild(document.createElement("i")); });
      const split = (el) => { const t = el.textContent; el.textContent = ""; return t.split("").map((c) => { const s = document.createElement("span"); s.textContent = c; el.appendChild(s); return s; }); };
      const charsL = split($("txtl"));
      const charsT = split($("txtt"));
      const barsL = Array.from($("wl").children);
      const barsT = Array.from($("wt").children);
      const rips = [0, 1, 2, 3, 4].map((i) => $("rip" + i));

      const tl = gsap.timeline({ paused: true });
      const dolly = $("dolly"), cam = $("cam"), stage = $("stage"), orb = $("orb");

      // initial states
      tl.set(stage, { opacity: 0 }, 0);
      tl.set([...charsL, ...charsT], { opacity: 0 }, 0);
      tl.set([...barsL, ...barsT], { scaleY: 0.12 }, 0);
      tl.set([$("ripple"), $("ripple2"), ...rips], { opacity: 0 }, 0);
      tl.set($("core"), { scale: 0.32 }, 0);
      tl.set($("kwword"), { opacity: 0 }, 0);
      tl.set($("kwbar"), { scaleX: 0 }, 0);

      // living background: one slow drift for the light, slow parallax for the grid
      tl.fromTo($("light"), { x: 0, y: 0 }, { x: 900, y: 240, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo($("grid"), { x: 0, y: 0 }, { x: -60, y: -30, duration: D, ease: "none" }, 0);
      // foreground keyword layer drifts against the camera
      tl.fromTo($("kw"), { y: 20 }, { y: -40, duration: D, ease: "none" }, 0);

      // Scene 1 — the real Voice Lab flies in from a 3D tilt with motion blur, then dollies
      tl.fromTo(cam, { opacity: 0, y: 90, scale: 0.9, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo(dolly, { rotationX: 16, rotationY: -14, scale: 1 }, { rotationX: 4, rotationY: -6, scale: 1.01, duration: 1.2, ease: "expo.out" }, 0);
      tl.fromTo($("kicker"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.7)" }, 0.3);

      // "speak?" — giant keyword scale-slam + underline swipe, then settles back
      tl.fromTo($("kwword"), { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0.68);
      tl.fromTo($("kwbar"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.82);
      tl.to([$("kwword"), $("kwbar")], { opacity: 0.18, duration: 0.6, ease: "power2.inOut" }, 1.3);

      // "Call" — camera swings toward the button; press-release-spring + two ring ripples
      tl.to(dolly, { rotationX: 2, rotationY: 4, scale: 1.05, duration: 0.86, ease: "power2.inOut" }, 1.36);
      tl.to($("btn"), { scale: 0.88, duration: 0.16, ease: "power1.in" }, 1.36);
      tl.to($("btn"), { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 1.52);
      tl.fromTo($("ripple"), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 3.2, duration: 0.8, ease: "power2.out", immediateRender: false }, 1.52);
      tl.fromTo($("ripple2"), { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 3.2, duration: 0.8, ease: "power2.out", immediateRender: false }, 1.72);

      // Scene 2 — "in the Voice Lab": zoom THROUGH the call button
      tl.fromTo(cam, { scale: 1, filter: "blur(0px)" }, { scale: 7, filter: "blur(18px)", duration: 0.33, ease: "power3.in", immediateRender: false }, 2.22);
      tl.to(cam, { opacity: 0.15, duration: 0.33, ease: "none" }, 2.22);
      tl.set(cam, { opacity: 0 }, 2.55);
      tl.fromTo(stage, { opacity: 0.15, scale: 0.75, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 2.55);
      tl.fromTo($("skick"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.7)" }, 2.75);

      // concentric ripples off the orb, one per spoken cue (finite)
      [3.29, 3.46, 4.22, 4.82, 5.08].forEach((t, i) => {
        tl.fromTo(rips[i], { opacity: 0.75, scale: 1 }, { opacity: 0, scale: 1.7, duration: 0.9, ease: "power2.out", immediateRender: false }, t);
      });

      // deterministic dancing bars; the orb swells with the voice
      const STEP = 0.1;
      const wave = (bars, t0, t1, seed, orbAmp) => {
        let k = 0;
        for (let t = t0; t < t1 - 0.001; t += STEP, k++) {
          let sum = 0;
          bars.forEach((b, i) => {
            const v = 0.15 + 0.85 * Math.abs(0.7 * Math.sin(i * 1.7 + k * 2.3 + seed) + 0.3 * Math.sin(i * 0.6 - k * 1.1));
            sum += v;
            tl.to(b, { scaleY: v, duration: STEP, ease: "sine.inOut" }, t);
          });
          tl.to(orb, { scale: 1 + orbAmp * (sum / bars.length), duration: STEP, ease: "sine.inOut" }, t);
        }
        const end = t0 + k * STEP;
        tl.to(bars, { scaleY: 0.12, duration: 0.2, ease: "power2.out" }, end);
        tl.to(orb, { scale: 1, duration: 0.1, ease: "power2.out" }, end);
      };

      // "It listens" — camera turns to the learner, ring pulses, learner wave + caption types
      tl.to(stage, { rotationY: 5, scale: 1.02, duration: 0.9, ease: "power2.inOut" }, 3.29);
      [3.29, 3.62, 3.95].forEach((t) => {
        tl.to($("ring"), { scale: 1.08, duration: 0.15, ease: "power2.out" }, t);
        tl.to($("ring"), { scale: 1, duration: 0.18, ease: "power2.in" }, t + 0.15);
      });
      tl.to($("whol"), { color: "#F59E0B", duration: 0.2 }, 3.29);
      wave(barsL, 3.29, 4.18, 0, 0.03);
      tl.fromTo($("capl"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 3.4);
      charsL.forEach((c, i) => tl.set(c, { opacity: 1 }, 3.46 + i * 0.026));

      // Scene 3 — "answers in a real voice": core blooms, camera swings to the tutor, tutor caption types
      tl.to(stage, { rotationY: -5, scale: 1.03, duration: 0.9, ease: "power2.inOut" }, 4.22);
      tl.to($("core"), { scale: 0.72, duration: 0.6, ease: "back.out(1.8)" }, 4.22);
      tl.to($("whol"), { color: "#504D48", duration: 0.2 }, 4.22);
      tl.to($("whot"), { color: "#F59E0B", duration: 0.2 }, 4.22);
      wave(barsT, 4.3, 6.3, 1.1, 0.06);
      [4.82, 5.59].forEach((t) => {
        tl.to($("ring"), { scale: 1.06, duration: 0.18, ease: "power2.out" }, t);
        tl.to($("ring"), { scale: 1, duration: 0.22, ease: "power2.in" }, t + 0.18);
      });
      tl.to($("capl"), { opacity: 0.45, duration: 0.3 }, 4.6);
      tl.fromTo($("capt"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 4.6);
      charsT.forEach((c, i) => tl.set(c, { opacity: 1 }, 4.65 + i * 0.024));

      // Scene 4 — "scores every answer": chip spins up, number counts to 82 and pulses as it lands
      tl.to(stage, { rotationY: -2, scale: 1.04, duration: 1.0, ease: "power2.out" }, 5.8);
      tl.fromTo($("chip"), { opacity: 0, y: 140, rotation: -14, scale: 0.6, filter: "blur(10px)" }, { opacity: 1, y: 0, rotation: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.6)" }, 5.8);
      const sc = { v: 0 };
      const num = $("num");
      tl.fromTo(sc, { v: 0 }, { v: 82, duration: 0.8, ease: "power2.out", onUpdate: () => { num.textContent = Math.round(sc.v); } }, 5.85);
      tl.fromTo(num, { scale: 1.3 }, { scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 6.62);
      tl.fromTo($("good"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.7)" }, 6.66);

      // micro-life on the hold: chip glows once and floats a touch (finite)
      tl.fromTo($("chip"), { boxShadow: "0 0 0px rgba(245,158,11,0)" }, { boxShadow: "0 0 48px rgba(245,158,11,0.35)", duration: 0.25, ease: "power2.out", immediateRender: false }, 6.75);
      tl.to($("chip"), { boxShadow: "0 0 0px rgba(245,158,11,0)", duration: 0.23, ease: "power2.in" }, 7.0);
      tl.to($("chip"), { y: -8, duration: 0.8, ease: "sine.inOut" }, 6.43);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
