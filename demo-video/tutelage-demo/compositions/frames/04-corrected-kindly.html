        SPARKS.map(() => '<span class="ck-spark"></span>').join("") + "</span>" +
        TEXT.slice(16).split("").map(ch).join("");

      const sparks = bold.querySelectorAll(".ck-spark");
      const went = $("went");

      const cam = $("cam"), outer = $("zoom-outer"), inner = $("zoom-inner");
      const tl = gsap.timeline({ paused: true });

      // background: orange light sweeps across, dot grid parallaxes the other way (full duration)

      // camera: tilted 3D hold → punch on "Slip up?" → swing round on "kindly" → slow drift to the end

      tl.fromTo(cam, { rotationY: 3 },
        { rotationY: 4.5, duration: DUR - 3.89, ease: "power1.inOut", immediateRender: false }, 3.89);

      // Scene 1 — push-in on the bubble (coordinate-target-zoom: outer scales, inner counter-translates,

      tl.fromTo($("bubble"), { rotation: -2 }, { rotation: 1.4, duration: 0.1, ease: "power2.inOut", immediateRender: false }, 0.72);
      tl.fromTo($("bubble"), { rotation: 1.4 }, { rotation: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 0.82);
